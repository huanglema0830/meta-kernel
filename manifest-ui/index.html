<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>显化工作台 · Manifest Journal</title>
<style>
  :root { --ink:#2b2b33; --dim:#8a8a96; --accent:#7c5cff; --bg:#faf9f6; --ok:#2e9e5b; --bad:#d64550; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; font-weight:700; margin:0; }
  .sub { color:var(--dim); font-size:12px; margin:2px 0 14px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  input[type=text] { flex:1; min-width:160px; padding:8px 10px; border:1px solid #dcd8d0; border-radius:8px; background:#fff; font-size:14px; }
  button { padding:8px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid #dcd8d0; }
  .status { font-size:12px; padding:2px 8px; border-radius:20px; }
  .status.ok { color:var(--ok); } .status.bad { color:var(--bad); }
  .card { background:#fff; border:1px solid #e6e2da; border-radius:14px; padding:16px; margin-bottom:14px; }
  .field { width:100%; min-height:60px; border:1px solid #e6e2da; border-radius:10px; padding:10px; font-size:15px; resize:vertical; font-family:inherit; }
  .meta { color:var(--dim); font-size:12px; margin-top:6px; word-break:break-all; }
  .lifebox { display:flex; align-items:center; gap:14px; margin:10px 0 6px; }
  .life { font-size:44px; font-weight:800; font-variant-numeric:tabular-nums; }
  .life.void { color:#c8c4bc; } .life.lit { color:var(--accent); }
  .lifeband { font-size:16px; font-weight:600; }
  .gauge { height:8px; border-radius:6px; background:#eeeae2; overflow:hidden; margin:6px 0 4px; }
  .gauge-fill { height:100%; width:0; background:linear-gradient(90deg,#9b7bff,#ff9a62); transition:width .4s ease; }
  .log { list-style:none; padding:0; margin:8px 0 0; font-size:13px; }
  .log li { padding:5px 0; border-bottom:1px dashed #efece6; }
  .log .t { color:var(--dim); font-size:11px; margin-right:6px; }
  .log .dim { color:var(--dim); }
  .intent { background:#f4f0ff; border-radius:10px; padding:10px 12px; font-size:13px; margin-top:10px; color:#4a3f78; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  ul.entries { list-style:none; padding:0; margin:6px 0 0; }
  ul.entries li { display:flex; gap:8px; align-items:center; padding:7px 4px; border-bottom:1px solid #efece6; cursor:pointer; }
  ul.entries li:hover { background:#f7f4ff; }
  .e-badge { font-variant-numeric:tabular-nums; font-weight:700; min-width:26px; color:var(--accent); }
  .e-raw { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  .dim { color:var(--dim); font-size:12px; }
  code { background:#efeaf7; padding:1px 5px; border-radius:5px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>显化工作台 <span style="font-size:12px;color:var(--dim);font-weight:400">Manifest Journal · Rust/WASM</span></h1>
  <div class="sub">文本 → 种子 → 推入内核 → 订阅事件 → 显化生命周期（0 / 10–99 → 回融）→ 显化日志流。</div>

  <div class="bar">
    <input id="gw" type="text" placeholder="网关地址 http://127.0.0.1:3000">
    <button id="btn-connect" class="ghost">连接</button>
    <span id="status" class="status">未连接</span>
  </div>

  <div class="card">
    <textarea id="input" class="field" placeholder="写一条念头/事务……（原文零修改展示）"></textarea>
    <div class="row"><button id="btn-light">点亮 → 注入内核</button></div>
  </div>

  <div class="card" id="active-card">
    <div class="meta" id="meta"></div>
    <div style="font-size:15px;margin:6px 0" id="raw"></div>
    <div class="lifebox"><span class="life void" id="life">00</span>
      <div><div class="lifeband" id="band">锚点</div>
      <div class="dim" id="rounds"></div></div></div>
    <div class="gauge"><div class="gauge-fill" id="gauge"></div></div>
    <div class="intent" id="intent">点击「点亮」注入一条念头</div>
    <div class="row"><button id="btn-boost">注入补充扰动</button><button id="btn-archive" class="ghost">归档（早退回融）</button></div>
  </div>

  <div class="card">
    <div style="font-weight:600;font-size:14px">显化日志流 <span style="font-weight:400;color:var(--dim);font-size:12px">（可溯源）</span></div>
    <ul class="log" id="log"></ul>
  </div>


  <div class="card">
    <div style="font-weight:600;font-size:14px">设备诊断 <span style="font-weight:400;color:var(--dim);font-size:12px">（输入问题描述 → 排查步骤；可选外部知识库）</span></div>
    <textarea id="diag-input" class="field" style="min-height:44px" placeholder="例：按键盘时部分按键没有反应，其他按键正常"></textarea>
    <div class="bar" style="margin-top:8px">
      <input id="kb-url" type="text" style="flex:2" placeholder="可选：外部知识库 URL，如 http://127.0.0.1:9877/diag（留空=内置通用排查）">
      <button id="btn-diag">诊断</button>
    </div>
    <div id="diag-out" class="intent" style="white-space:pre-line">输入故障描述后点「诊断」。</div>
  </div>
  <div class="card">
    <div style="font-weight:600;font-size:14px">历史条目 <span style="font-weight:400;color:var(--dim);font-size:12px">（点击恢复显示）</span></div>
    <ul class="entries" id="entries"></ul>
  </div>
</div>
</body>
</html>
