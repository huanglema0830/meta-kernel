[package]
name = "npb-appkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "L4 应用框架（点亮→外显）：显化生命周期状态机 + 命名/语言组织 + L3 SSE 事件归一（EventPipe）。std 零第三方依赖。"

# 特性：net（默认）= httpc/event_pipe（std::net，native）；--no-default-features 时仅纯逻辑
#（lifecycle/namer/speaker/normalize），供 wasm 浏览器前端复用（wasm 无 std::net）。
[features]
default = ["net"]
net = []

# 集成测试需起真实网关 → dev-dependency（仅 net 特性测试时使用）
[dev-dependencies]
npb-gateway = { path = "../npb-gateway" }
