<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元内核 · 禅境示波器（Phase 4）</title>
<style>
  body { margin:0; min-height:100vh; background:#07090d; color:#cfe3d8;
         font-family:ui-monospace,Menlo,Consolas,monospace;
         display:flex; align-items:center; justify-content:center; }
  .wrap { width:700px; padding:16px 12px; }
  header { display:flex; justify-content:space-between; align-items:baseline; }
  h1 { font-size:15px; font-weight:500; letter-spacing:.24em; color:#7fd7b4; margin:0; }
  .sub { font-size:11px; color:#5f6d7c; }
  .stage { display:flex; gap:14px; margin-top:14px; }
  canvas#scope { border:1px solid #1a2430; border-radius:14px; background:#0a0f15; }
  .side { flex:1; display:flex; flex-direction:column; gap:7px; }
  .stat { border:1px solid #16202b; border-radius:10px; padding:6px 12px; background:#0c1219; }
  .stat .k { font-size:11px; color:#7c8b99; }
  .stat .v { font-size:19px; color:#9fe1cb; font-weight:500; }
  .stat .v.dim { color:#c9b37e; }
  .stat .v.state { font-size:16px; }
  .mini { display:flex; justify-content:space-between; font-size:11px; color:#5f6d7c; }
  button { margin-top:10px; padding:7px 14px; border:1px solid #1d9e75; border-radius:8px;
           background:#0d231c; color:#9fe1cb; cursor:pointer; font:inherit; }
  button:active { background:#123529; }
  button.sound-on { border-color:#ef9f27; color:#fac775; }
  .panels { display:flex; gap:14px; margin-top:10px; }
  .panel { border:1px solid #16202b; border-radius:10px; background:#0c1219; padding:6px 10px; }
  .panel .pk { font-size:11px; color:#7c8b99; margin-bottom:4px; }
  canvas#traj { width:330px; height:150px; }
  canvas#spark { width:342px; height:150px; }
  #err { display:none; margin-top:10px; padding:8px 12px; border:1px solid #a32d2d;
         border-radius:8px; background:#2a0f0f; color:#f09595; font-size:12px;
         white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>META-KERNEL · 禅境示波器</h1>
    <span class="sub">同一内核 · WASM 直驱 · 化学变化层 + 正源场域（Phase 4）</span>
  </header>
  <div class="stage">
    <canvas id="scope" width="330" height="330"></canvas>
    <div class="side">
      <div class="stat"><div class="k">内核输出 pop_result</div><div class="v" id="out">0.000</div></div>
      <div class="stat"><div class="k">系统熵 get_entropy</div><div class="v dim" id="ent">1.000</div></div>
      <div class="stat"><div class="k">当前物态（化学变化层）</div><div class="v state" id="state">—</div></div>
      <div class="stat"><div class="k">思考链长度 / 推演节点</div><div class="v" id="chainMeta">0 / 0</div></div>
      <div class="stat"><div class="k">双链诊断</div>
        <div class="mini"><span id="diag">形成 0 步 · 解决 0 步</span><span id="diagState">未启动</span></div>
      </div>
      <div class="stat"><div class="k">正源触达范围 / 路径</div>
        <div class="mini"><span id="reach">L0</span><span id="reachPaths">0 路径</span></div>
      </div>
      <button id="seedBtn">注入扰动 (1.0)</button>
      <button id="soundBtn" class="">声音模式: 关</button>
    </div>
  </div>
  <div class="panels">
    <div class="panel">
      <div class="pk">轨迹图（x=当前输出, y=上一输出）— 螺旋/分形/吸引子</div>
      <canvas id="traj" width="330" height="150"></canvas>
    </div>
    <div class="panel">
      <div class="pk">时间波形（呼吸痕迹）</div>
      <canvas id="spark" width="342" height="150"></canvas>
    </div>
  </div>
  <div id="err"></div>
  <p class="sub" style="text-align:center;margin-top:8px">
    打开即呼吸 · 点按钮注扰动 · 声音开关需一次点击后才能发声（浏览器自动播放策略）
  </p>
</div>
<script src="zen.js"></script>
</body>
</html>
