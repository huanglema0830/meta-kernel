name: ci

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, minimal)
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Run tests (10000-iteration stability included)
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee phase1-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-test-log
          path: phase1-test.log
