name: ci

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests (excluding npb-gateway)
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --exclude npb-gateway 2>&1 | tee phase1-test.log

      # D27 / 子任务2.1：`no_std` 子集必须能编到**裸机目标** —— 这是阶段二"元内核自举"路线的**第一道门禁**。
      # 该 crate 是 workspace 成员 ⇒ 其单元测试（含 `fmath` 与 std 的**精度逐点对照**）已由上面的
      # `cargo test --workspace` 覆盖；本步骤只额外验证"能编到 `x86_64-unknown-none`"。
      # 说明：**编译通过即证明未依赖 `alloc`**（`no_std` 下无 `alloc` crate，出现 `Vec`/`String` 会直接编译失败）。
      - name: 验收 no_std 构建门禁（x86_64-unknown-none）—— 阶段二自举第一道门禁
        shell: bash
        run: |
          set -o pipefail
          rustup target add x86_64-unknown-none
          cargo build -p meta-kernel-core-nostd --target x86_64-unknown-none 2>&1 | tee nostd-build.log
          # 显式断言产物存在：避免"其实没编译却退出码 0"这类空转
          test -f target/x86_64-unknown-none/debug/libmeta_kernel_core_nostd.rlib \
            || { echo "::error::no_std 构建产物缺失（疑似未真正编译）"; exit 1; }
          echo "NOSTD_BUILD_OK"

      - name: Run npb-gateway tests (single-thread, nocapture, 120s watchdog)
        shell: bash
        run: |
          set -o pipefail
          timeout 120 cargo test -p npb-gateway -- --nocapture --test-threads=1 2>&1 | tee gateway-test.log || { echo "GATEWAY_TEST_TIMEOUT_OR_FAIL (exit $?)"; exit 1; }
          echo GATEWAY_TESTS_OK

      - name: Upload npb-gateway test log
        if: always()
        # R24：诊断性**产物上传**不是门禁 —— GitHub 侧产物服务抖动（实测 `Failed to FinalizeArtifact: 403 Forbidden`）
        # 会把整个 job 判红，**掩盖真实状态**（那次 20/20 个真实步骤全过、重跑即绿）。
        # 故上传步骤一律 non-fatal；**真正的门禁（测试/构建/像素断言/C9）保持硬失败，不放宽**。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-log
          path: gateway-test.log

      - name: L3 网关活体验证（真实进程 + curl 五端点 + SSE 持续推送）
        shell: bash
        run: |
          set -e
          echo "===== STEP 0: cargo build -p npb-gateway ====="
          cargo build -p npb-gateway 2>&1 | tail -2
          echo "===== STEP 1: cargo run 起网关 (127.0.0.1:3000) ====="
          ./target/debug/npb-gateway 3000 > gateway_live.log 2>&1 &
          GW=$!
          sleep 2
          echo "===== STEP 2a: GET /v1/health ====="
          curl -s http://127.0.0.1:3000/v1/health | tee h.out
          grep -q '"ok":true' h.out
          grep -q '"writer":"single"' h.out
          echo "===== STEP 2b: GET /v1/state ====="
          curl -s http://127.0.0.1:3000/v1/state | tee s.out
          grep -q '"schema":1' s.out
          grep -q '"extensions":{}' s.out
          grep -q '"last":' s.out
          echo "===== STEP 2c: POST /v1/push 正扰动 ====="
          curl -s -X POST http://127.0.0.1:3000/v1/push -H 'Content-Type: application/json' -d '{"seed":0.5}' | tee p.out
          grep -q '"accepted":true' p.out
          echo "===== STEP 2d: POST /v1/push 负扰动应拒 ====="
          curl -s -X POST http://127.0.0.1:3000/v1/push -H 'Content-Type: application/json' -d '{"seed":-0.3}' | tee pn.out
          grep -q gate_rejected pn.out
          echo "===== STEP 2e: POST /v1/persist/snapshot ====="
          curl -s -X POST http://127.0.0.1:3000/v1/persist/snapshot -d '{}' | tee psv.out
          grep -q 'stored' psv.out
          echo "===== STEP 2f: POST /v1/persist/restore (snapshot roundtrip) ====="
          curl -s -X POST http://127.0.0.1:3000/v1/persist/restore -H 'Content-Type: application/json' -d "@psv.out" | tee pr.out
          grep -q '"ok":true' pr.out
          echo "===== STEP 3: curl -N /v1/events SSE 持续推送观测 (5s) ====="
          timeout 5 curl -sN http://127.0.0.1:3000/v1/events > sse.out 2>&1 &
          SSE=$!
          sleep 1
          curl -s -X POST http://127.0.0.1:3000/v1/push -H 'Content-Type: application/json' -d '{"seed":0.9}' >/dev/null
          curl -s -X POST http://127.0.0.1:3000/v1/push -H 'Content-Type: application/json' -d '{"seed":0.6}' >/dev/null
          wait $SSE || true
          echo "--- SSE 收到的事件 ---"
          grep '^event:' sse.out | sort | uniq -c
          grep -q 'event: snapshot' sse.out
          grep -q 'event: ping' sse.out
          echo "===== STEP 4: 收尾 ====="
          kill $GW 2>/dev/null || true
          echo L3_GATEWAY_LIVE_VERIFY_ALL_OK

      - name: Upload workspace test log
        if: always()
        # R24：诊断性**产物上传**不是门禁 —— GitHub 侧产物服务抖动（实测 `Failed to FinalizeArtifact: 403 Forbidden`）
        # 会把整个 job 判红，**掩盖真实状态**（那次 20/20 个真实步骤全过、重跑即绿）。
        # 故上传步骤一律 non-fatal；**真正的门禁（测试/构建/像素断言/C9）保持硬失败，不放宽**。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-test-log
          path: phase1-test.log

      - name: Guard site files exist (anti accidental deletion)
        shell: bash
        run: |
          test -f npb/bridge.h
          test -f examples/dos_concept/main.c
          test -f examples/wasm_canvas/self_test.js
          test -f examples/wasm_canvas/index.html
          test -f examples/zen-oscilloscope/index.html
          test -f examples/zen-oscilloscope/zen.js
          test -f examples/tools/serve.py
          test -f manifest-ui/index.html
          test -f manifest-ui/src/app.rs
          test -f manifest-ui/src/l6_app.rs
          echo SITE_FILES_OK

      # ===== 机制 17：私有资产**指针**门禁（骨架-实现分离的机器校验）=====
      # 为什么在 CI 只跑 syntax 模式：**CI 看不到私有文件夹**（它在仓库外、CI 上根本不存在）
      # ⇒ 存在性校验必须在本机跑（`--mode=resolve`）。CI 这一半负责：
      #   ① 每个 `{PRIVATE_ASSETS}/<路径>` 的**格式**合法（无 `..`/反斜杠/绝对路径）
      #   ② 仓库内**不得新增** ⛔ 泄漏（本机绝对路径 / 用户名 / 内网 IP）
      #      —— 基线见 `coordination/security/leak_baseline.txt`，**只减不增**（C15）
      - name: 机制 17 指针门禁 —— 引用格式 + ⛔ 泄漏基线（CI 安全的一半）
        shell: bash
        run: |
          set +e
          python3 coordination/tools/check_private_pointers.py --mode=syntax
          CODE=$?
          echo "---- exit=$CODE ---- (0=通过；非 0=有格式错误或新增泄漏)"
          set -e
          test "$CODE" -eq 0

      # ===== 机制 21：**内核纯度**门禁（执行体归属判据的机器校验）=====
      # 判什么：内核三个 crate（core / nostd / mem）的**非测试代码区**，不得出现 7 类「感知/动作」用法
      #   （文件 IO · 网络 · 进程 · 时钟 · 环境变量 · 线程 · 系统调用）。
      # 为什么：内核的边界是「**只算**」——需要感知/动作的必须落在宿主或 WorkBuddy 侧。
      #   这条边界以前只写在文档里 ⇒ 下一个人加一行 std::fs **不会被发现**。
      # 自检：--selftest 四侧（注入真违规必红 / 注释与 alloc::·core::·env! 不误报 /
      #   仅测试区违规「可见但不判红」）——**判据本身也要被验**，否则门禁可能空转。
      - name: 机制 21 内核纯度门禁 —— 内核不得出现「感知/动作」用法（含判据自检）
        shell: bash
        run: |
          set +e
          python3 coordination/tools/check_kernel_purity.py --selftest
          SELFTEST=$?
          python3 coordination/tools/check_kernel_purity.py
          CHECK=$?
          echo "---- SELFTEST=$SELFTEST CHECK=$CHECK ---- (两个都应为 0)"
          set -e
          test "$SELFTEST" -eq 0 && test "$CHECK" -eq 0

      # ===== 机制 22（D53）：**源一致性**门禁（防止再拿脚手架当底图）=====
      # 判什么：
      #   A/B. CHARTER.md 与 MEMORY.md 必须含底图硬指针（`README.md` + `docs/`）
      #   C.   CHARTER.md 必须声明「与底图冲突时以底图为准」
      #   D.   核心底图集 7 份在 CHARTER ∪ MEMORY 中全部出现（R61：与 CHARTER 机制 22 及脚本 CORE 统一为 7 份）
      #   E.   README.md「阶段路线（主线）」四阶段与 ROADMAP.md 三阶段必须有**显式映射**声明
      #        （两套刻度：底图四阶段答「内核能力推进到哪层」，ROADMAP 三阶段答「用户何时能装上」）
      #   F.   底图哈希基线（`coordination/security/basemap_hashes.txt`）—— 底图被静默改 ⇒ 判红
      # 为什么：2026-09-18 事故——CHARTER 自称"自包含"、实测提及 `docs/` = 0 次 ⇒ 我按脚手架编了全量汇编，
      #   被用户当面纠错「好多是你自己加上去的，并不是我们原来设计的」。这条门禁把"读底图"变成**机器事实**。
      # 为什么 CI 用 --ci：MEMORY.md 在**仓库外**（研发开发/.workbuddy/memory/），CI 上不存在 ⇒ 降级 warn，
      #   存在性由本机跑（不带 --ci）时校验。
      # 自检：--selftest 阳性 1 + 阴性 2（抽掉 `docs/` 必红 / 抽掉阶段映射必红）——判据本身也要被验。
      - name: 机制 22 源一致性门禁 —— CHARTER/MEMORY 底图指针 + 阶段口径映射 + 底图哈希（含判据自检）
        shell: bash
        run: |
          set +e
          python3 coordination/tools/check_source_of_truth.py --selftest
          SELFTEST=$?
          python3 coordination/tools/check_source_of_truth.py --ci
          CHECK=$?
          echo "---- SELFTEST=$SELFTEST CHECK=$CHECK ---- (两个都应为 0)"
          set -e
          test "$SELFTEST" -eq 0 && test "$CHECK" -eq 0

      # ===== R60 前置提示：改 `docs/` 须先 `--update-baseline`（机制 22 判据 F 的可操作前导）=====
      # 为什么要单独一步：判据 F 判红时只说「底图内容已变」，操作者容易误读成"底图被篡改"。
      #   本步骤把**唯一的正确处置**（跑 --update-baseline，并把改动理由写进提交消息 / BASELINE）显式前置。
      # 口径（R35）：本步骤**只提示、不判红**——硬门禁是下一步「机制 22」的判据 F。
      - name: R60 前置提示 —— 改 docs/ 须先 --update-baseline（只提示 · 不判红）
        shell: bash
        run: |
          set +e
          echo "=============================================================="
          echo "[R60 提示] 任何改动 docs/ 下 .md 的提交，都必须先跑："
          echo "    python3 coordination/tools/check_source_of_truth.py --update-baseline"
          echo "  并在提交消息 / BASELINE 中写明【改动理由】。"
          echo "  不跑 ⇒ 下一步「机制 22 源一致性门禁」的判据 F 必判红（CI 不会绿）。"
          echo "  [口径] 基线只覆盖 docs/ 全 35 份 .md；README.md 不在基线内（不触发判据 F）。"
          echo "=============================================================="
          echo "[R60 本次提交触及的 docs/ 文件]"
          if git rev-parse --verify -q HEAD~1 >/dev/null 2>&1; then
            git diff --name-only HEAD~1 HEAD -- docs/ | sed 's/^/  /' || true
          else
            # R68 修复：CI 为浅克隆（checkout 默认 fetch-depth=1）⇒ 无 HEAD~1。
            # 此时退化为"与基线比对"，仍能指出需要 --update-baseline 的具体文件（不再是空提示）。
            echo "  （浅克隆：无 HEAD~1 ⇒ 改用与底图哈希基线比对）"
            python3 coordination/tools/check_source_of_truth.py --ci 2>&1 | grep -F "底图内容已变" | sed 's/^/  /' || echo "  （与基线一致）"
          fi
          echo "[R60 本次提交是否同步更新了基线]"
          if git rev-parse --verify -q HEAD~1 >/dev/null 2>&1 && \
             git diff --name-only HEAD~1 HEAD -- coordination/security/basemap_hashes.txt 2>/dev/null | grep -q .; then
            echo "  OK 基线已同步更新"
          else
            echo "  WARN 基线未在本提交内更新（若上面 docs/ 列表非空 ⇒ 判据 F 将判红）"
          fi
          exit 0

      # ===== 机制 24（Q14 裁定）：**端点表一致性**门禁（防止「文档跟不上代码」）=====
      # 判什么：`npb-gateway/src/http.rs` 非测试区 的 `/v1` 路径 与 `docs/LAYER_ARCHITECTURE.md` §4.L3 权威表 的差集。
      #   [1] 代码有、权威表无 ⇒ **判红**（新端点必须先写进权威表；确属内部/调试端点须登记到 endpoint_whitelist.txt）
      #   [2] 权威表有、代码无 ⇒ **只提示**（可能是"已设计未实现"或"已下线"，但表里须如实标注状态）
      # 口径（R35）：**路径口径**（不含 method；method 差异由权威表行内写明）。
      # 为什么：实测 28 条路由 / 23 个路径，而此前最全的一处口径只覆盖 8 个 ⇒ 差集 15；
      #   其中 7 个（msg/report/alerts/tasks 族）在 docs/ 35 份中命中 0 ⇒ 新人照旧文档实现会漏掉一整族端点。
      # 自检：--selftest **五侧**（合规/代码多/表多/仅测试/**真实仓库锚点**）。
      #   ⚠️ 第 ⑤ 侧是本判据自己的教训：初版锚点常量多写了一个字，而自检夹具与常量**同错** ⇒
      #   自检全绿、实跑判红。故自检必须**回读真实仓库**，不能只测自造夹具。
      - name: 机制 24 端点表一致性门禁 —— 代码路由 ⊆ 权威端点表（含判据自检）
        shell: bash
        run: |
          set +e
          python3 coordination/tools/check_endpoint_table.py --selftest
          SELFTEST=$?
          python3 coordination/tools/check_endpoint_table.py
          CHECK=$?
          echo "---- SELFTEST=$SELFTEST CHECK=$CHECK ---- (两个都应为 0)"
          set -e
          test "$SELFTEST" -eq 0 && test "$CHECK" -eq 0

      - name: Build NPB cdylib (native)
        run: cargo build -p npb

      - name: Build & run DOSBox concept demo (C via bridge.h)
        shell: bash
        run: |
          cc -std=c11 -Wall examples/dos_concept/main.c -I npb -o dos_demo \
             -L target/debug -lnpb -Wl,-rpath,"$PWD/target/debug"
          ./dos_demo | tee dos_demo.log
          grep -q "BEEP" dos_demo.log
          grep -q "KERNEL_DEMO_DONE" dos_demo.log

      - name: Upload DOS demo log
        if: always()
        # R24：诊断性**产物上传**不是门禁 —— GitHub 侧产物服务抖动（实测 `Failed to FinalizeArtifact: 403 Forbidden`）
        # 会把整个 job 判红，**掩盖真实状态**（那次 20/20 个真实步骤全过、重跑即绿）。
        # 故上传步骤一律 non-fatal；**真正的门禁（测试/构建/像素断言/C9）保持硬失败，不放宽**。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dos-demo-log
          path: dos_demo.log

      - name: Native self-test digest
        shell: bash
        run: cargo run -p npb --example self_test | tee native_digest.log

      - name: Build wasm32 (same kernel for browser)
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p npb --release --target wasm32-unknown-unknown

      - name: Cross-platform consistency (native vs wasm digest)
        shell: bash
        run: |
          cp target/wasm32-unknown-unknown/release/npb.wasm examples/wasm_canvas/npb.wasm
          node examples/wasm_canvas/self_test.js examples/wasm_canvas/npb.wasm | tee wasm_digest.log
          diff <(grep DIGEST native_digest.log) <(grep DIGEST wasm_digest.log)
          echo CROSS_PLATFORM_CONSISTENT

      - name: Spiral metric unit test (node, no wasm)
        shell: bash
        run: node examples/zen-oscilloscope/spiral_test.js

      - name: Manifest UI wasm 前端构建（wasm-bindgen，产物=dist/）
        shell: bash
        run: |
          set -e
          rustup target add wasm32-unknown-unknown
          curl -sSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz -o /tmp/wb.tgz
          tar -xzf /tmp/wb.tgz -C /tmp
          export PATH="/tmp/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl:$PATH"
          cargo build -p manifest-ui --release --target wasm32-unknown-unknown
          mkdir -p manifest-ui/dist
          wasm-bindgen target/wasm32-unknown-unknown/release/manifest_ui.wasm --out-dir manifest-ui/dist --target web
          test -f manifest-ui/dist/manifest_ui.js
          test -f manifest-ui/dist/manifest_ui_bg.wasm
          echo MANIFEST_UI_WASM_OK

      - name: 工作台纯函数测试（安全 XSS/注入 + 混沌健壮 · 无需浏览器）
        shell: bash
        run: node examples/ui-verify/logic-test.mjs

      - name: UI 自动目验（真实浏览器断言诊断结论可读）
        shell: bash
        run: |
          set -e
          PORT=3210
          DIST=manifest-ui/dist

          echo "===== STEP 1: 拼装 dist/index.html（注入 module script）====="
          python3 - <<'PY'
          import io
          src = io.open('manifest-ui/index.html', encoding='utf-8').read()
          inject = '\n<script type="module">\n  import init, { field_parse } from "./manifest_ui.js";\n  await init();\n  window.__fieldParse = field_parse;\n</script>\n'
          if 'manifest_ui.js' not in src:
              src = src.replace('</body>', inject + '</body>')
          io.open('manifest-ui/dist/index.html', 'w', encoding='utf-8', newline='\n').write(src)
          print('dist/index.html assembled')

          # 占位升级包：验证 /upgrade-package.zip 的路由与白名单（STORED 避免被压缩到 <1KB）
          import zipfile
          z = zipfile.ZipFile('manifest-ui/dist/upgrade-package.zip', 'w', zipfile.ZIP_STORED)
          z.writestr('placeholder.txt', 'x' * 4096)
          z.close()
          print('dist/upgrade-package.zip placeholder')
          PY
          test -f $DIST/index.html

          echo "===== STEP 2: 起网关（同源托管 dist/）====="
          ./target/debug/npb-gateway $PORT --ui $DIST > ui_gw.log 2>&1 &
          GW=$!
          trap 'kill $GW 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:$PORT/v1/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:$PORT/v1/health | grep -q '"ok":true'
          curl -sf -o /dev/null http://127.0.0.1:$PORT/
          echo GATEWAY_WITH_UI_UP

          echo "===== STEP 3: 注入构造场域数据（火亢，结论可预测）====="
          curl -sf -X POST http://127.0.0.1:$PORT/v1/probe \
            -H 'Content-Type: application/json' \
            -d '{"schema":1,"s":[2.0,2.0,2.0,1.0,1.0,1.0,1.0],"at":"ci"}' >/dev/null
          curl -sf http://127.0.0.1:$PORT/v1/probe | grep -q '"schema":1'
          echo PROBE_INJECTED

          echo "===== STEP 4: Playwright 真实浏览器目验 ====="
          cd examples/ui-verify
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          UI_URL=http://127.0.0.1:$PORT/ UI_TIMEOUT=60000 node verify.mjs
          echo UI_AUTO_VERIFY_ALL_OK

      - name: Upload UI verify artifacts (always)
        if: always()
        # R24：诊断性**产物上传**不是门禁 —— GitHub 侧产物服务抖动（实测 `Failed to FinalizeArtifact: 403 Forbidden`）
        # 会把整个 job 判红，**掩盖真实状态**（那次 20/20 个真实步骤全过、重跑即绿）。
        # 故上传步骤一律 non-fatal；**真正的门禁（测试/构建/像素断言/C9）保持硬失败，不放宽**。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ui-verify-artifacts
          path: |
            examples/ui-verify/ui_verify.png
            ui_gw.log
          if-no-files-found: warn

      # R24（用户要求：可 non-fatal，但**必须显式警告并留痕**）——
      # 用 `toJSON(steps)` 精确判定"有没有步骤被 continue-on-error 吸收"，**不是无脑告警**。
      # 本 job 只有 upload-artifact 是 non-fatal ⇒ outcome=failure 只可能来自它们。
      - name: R24 检查 —— 诊断性上传是否发生软失败（显式告警 · 留痕）
        if: always()
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          set +e
          N=$(printf '%s' "$STEPS" | grep -o '"outcome":"failure"' | wc -l | tr -d ' ')
          echo "被 continue-on-error 吸收的失败步骤数：$N"
          if [ "$N" != "0" ]; then
            echo "::warning::R24 —— 本 job 有 $N 个**诊断性产物上传**软失败（GitHub 产物服务抖动，如 FinalizeArtifact 403）。这不影响门禁：所有判定性步骤仍为硬失败、一条断言未放宽。"
          else
            echo "R24_UPLOAD_NO_SOFT_FAILURE"
          fi

  # ===========================================================================================
  # boot-image（阶段二·子任务2.2：bootloader 0.11 接入 + QEMU **真实引导** + 截屏断言）
  #
  # 为什么**单开一个 job**，而不是塞进 `test`：
  #   ① `meta-kernel-boot` **不在 workspace**（同 `host/field-render` 先例；boot 链的目标平台不是宿主）
  #      ⇒ `cargo test --workspace` 根本不会碰它。**这正是 R18 的教训**（独立 crate 长期无人跑），
  #         故必须**显式**把 boot 层纳入 CI。
  #   ② 本 job 需要 **nightly**：bootloader 0.11 的 BIOS/UEFI stage 用 `-Zbuild-std` 构建；
  #      而 artifact 依赖（把内核 ELF 当构建输入）也要求 `-Z bindeps` ——
  #      stable cargo 会直接报 `artifact = … requires -Z bindeps`（本地实测，非文档推测）。
  #      ⇒ 与 `test` job 的 stable 隔离，**不把整条流水线拖上 nightly**（对应 D31-b）。
  #
  # 验收口径（**路线 A：零 unsafe**，D31-d）：
  #   内核把自检结果编码成**整屏颜色**（见 meta-kernel-boot/kernel/src/verify.rs）：
  #     绿 = 引导成功 **且** 内核自检全过；红 = 自检失败；其它 = 未进内核/无帧缓冲 ⇒ 一律判失败。
  #   ⇒ 断言 = 「QEMU 截屏采样点 == 绿」，**同时**证明：引导器真的加载并进入了内核入口、
  #      且 2.1 迁出的内核子集（fmath + L4 判据 + 四戒律风险）在**裸机上真的算对了**。
  #   判据脚本自带正反两侧自检（`scripts/check_screendump.py`，本地已用合成 PPM 验证过
  #   绿→0 / 红→1 / 黑→1 / 半绿半黑→1），避免"断言空转"。
  # ===========================================================================================
  boot-image:
    name: 元内核引导镜像（bootloader 0.11 + QEMU 真实引导）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 nightly（boot 层专用）+ llvm-tools-preview + rust-src + 裸机 target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal \
            --component llvm-tools-preview --component rust-src
          # ⚠️ 必须显式加裸机 target：**本机早因 2.1 装过，会掩盖这个缺口** ——
          #    首跑 CI 就报 `error[E0463]: can't find crate for core`
          #    （`the x86_64-unknown-none target may not be installed`）。
          #    这是 R14 同族问题："本机绿 ≠ CI 绿"，故在此显式安装 + 显式断言。
          rustup target add x86_64-unknown-none --toolchain nightly
          rustup target list --installed --toolchain nightly | tee "$RUNNER_TEMP/nightly_targets.txt"
          grep -qx 'x86_64-unknown-none' "$RUNNER_TEMP/nightly_targets.txt" \
            || { echo "::error::nightly 缺少裸机 target x86_64-unknown-none"; exit 1; }
          rustc +nightly --version
          echo "NIGHTLY_BOOT_TOOLCHAIN_OK"
          echo "nightly 仅用于本 job 的 boot 层；workspace 其余部分由 test job 的 stable 构建（D31-b）"

      - name: 安装 QEMU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86
          qemu-system-x86_64 --version

      - name: 构建可引导镜像（bootloader 0.11 + 内核 ELF）
        shell: bash
        run: |
          set -uo pipefail
          set +e     # 外层 `shell: bash` 自带 -e：必须显式关掉才能打印失败详情（R13 教训）
          cd meta-kernel-boot
          cargo +nightly build --target-dir "$RUNNER_TEMP/bo" > "$GITHUB_WORKSPACE/boot_build.log" 2>&1
          CODE=$?
          tail -20 "$GITHUB_WORKSPACE/boot_build.log"
          echo "---- exit=$CODE ----"
          test "$CODE" = "0" || { echo "::error::boot 层构建失败（exit=$CODE）"; exit 1; }

          IMG="$(find "$RUNNER_TEMP/bo" -name 'boot-bios.img' | head -1)"
          test -n "$IMG" || { echo "::error::未产出 boot-bios.img（build.rs 未真正生成镜像？）"; exit 1; }
          test -s "$IMG" || { echo "::error::boot-bios.img 为空"; exit 1; }
          # 显式断言 MBR 引导签名：防"生成了一个不是可引导镜像的文件"这类空转
          SIG="$(od -An -tx1 -j 510 -N 2 "$IMG" | tr -d ' \n')"
          echo "IMAGE=$IMG size=$(stat -c%s "$IMG") mbr_sig=$SIG"
          test "$SIG" = "55aa" || { echo "::error::镜像缺 MBR 引导签名(55aa)，实测=$SIG"; exit 1; }
          echo "BOOT_IMAGE_BUILT_OK"
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: QEMU 真实引导 + 截屏（判定信号＝整屏颜色）
        shell: bash
        run: |
          set -euo pipefail
          test -n "${IMG:-}" || { echo "::error::IMG 未设置（构建步骤未通过）"; exit 1; }
          # 无显示窗口 + 监视器走 stdio：等内核把自检结果刷成整屏颜色后再截屏
          ( sleep 12; echo "screendump $PWD/shot.ppm"; sleep 3; echo "quit" ) \
            | qemu-system-x86_64 \
                -drive format=raw,file="$IMG" \
                -m 512M -display none -monitor stdio -no-reboot \
                > qemu.log 2>&1 || true
          sed -n '1,20p' qemu.log
          test -f shot.ppm || { echo "::error::未生成 shot.ppm（screendump 失败？见 qemu.log）"; exit 1; }
          ls -la shot.ppm

      - name: 断言截屏像素 == 绿（引导成功 + 内核自检全过）
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          set +e
          test -n "${IMG:-}" || { echo "::error::IMG 未设置（构建步骤未通过）"; exit 1; }
          test -f shot.ppm || { echo "::error::缺少 shot.ppm（QEMU 步骤未产出）"; exit 1; }
          python3 meta-kernel-boot/scripts/check_screendump.py shot.ppm --expect 0,255,0
          CODE=$?
          echo "---- 断言 exit=$CODE ----"
          test "$CODE" = "0" || { echo "::error::截屏断言未通过（非整屏绿 ⇒ 未进入内核或自检失败）"; exit 1; }
          echo "BOOT_QEMU_SCREENSHOT_OK"

      - name: Upload 引导镜像与截屏（always）
        if: always()
        # R24：诊断性**产物上传**不是门禁 —— GitHub 侧产物服务抖动（实测 `Failed to FinalizeArtifact: 403 Forbidden`）
        # 会把整个 job 判红，**掩盖真实状态**（那次 20/20 个真实步骤全过、重跑即绿）。
        # 故上传步骤一律 non-fatal；**真正的门禁（测试/构建/像素断言/C9）保持硬失败，不放宽**。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: meta-kernel-boot-image
          path: |
            shot.ppm
            qemu.log
            boot_build.log
          if-no-files-found: warn

      - name: R24 检查 —— 诊断性上传是否发生软失败（显式告警 · 留痕）
        if: always()
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          set +e
          N=$(printf '%s' "$STEPS" | grep -o '"outcome":"failure"' | wc -l | tr -d ' ')
          echo "被 continue-on-error 吸收的失败步骤数：$N"
          if [ "$N" != "0" ]; then
            echo "::warning::R24 —— 本 job 有 $N 个**诊断性产物上传**软失败（GitHub 产物服务抖动）。门禁未受影响：像素断言与镜像签名断言仍为硬失败。"
          else
            echo "R24_UPLOAD_NO_SOFT_FAILURE"
          fi

  # ===========================================================================================
  # 宿主 field-render（Windows 真实构建 + 客观验收）
  #
  # 为什么需要这个 job（R6）：此前 CI 只有一个 ubuntu-latest job，`field-render` 命中 0 —— 宿主
  # **从未被 CI 构建**，"CI 为权威宿主验收"不成立，2026-09-16 本机真实跑通的成果无法自动回归。
  #
  # 为什么用 GNU + llvm-mingw（R1 教训，已固化为步骤，勿删）：
  #   windows-sys(raw-dylib) / libloading 需要 dlltool；rustup 自带的 GNU dlltool **依赖汇编器
  #   `as`，且只在自己目录里找 `as`** → `CreateProcess` 失败（v0.126 本机实测根因）。
  #   llvm-mingw 的 `dlltool.exe` = **llvm-dlltool（自包含，不需要 `as`）** → 把它的 bin **前置到
  #   PATH** 即可。本地对应 `~/.cargo/config.toml` 的 GNU linker 指向该工具链；CI 里以
  #   `CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER` 等价复刻。
  #
  # 为什么需要 libgcc 映射（R1-b 第三次失败的真实根因，2026-09-16 实测坐实）：
  #   rustc 对 `windows-gnu` target 会**无条件**在链接行里加 `-lgcc_eh` / `-lgcc`（GNU 命名），
  #   而 **llvm-mingw 的 sysroot 里没有这两只库**（官方 20260826 与 20260908 的
  #   `x86_64-w64-mingw32/lib/` 都只有 libmingw32/wex/thrd.a）——因为 llvm-mingw 工具链自己用
  #   **compiler-rt + libunwind**，根本不需要 GNU libgcc。
  #   ⇒ 报错：`lld: error: unable to find library -lgcc_eh` / `-lgcc`。
  #   ⚠️ 本机之所以"能构建"，是因为本地 sysroot 里被**人为放了两只伪装库**
  #      （把 `libunwind.a` 复制成 `libgcc.a` 与 `libgcc_eh.a`，两文件字节全同、大小均 91768
  #       ＝ libunwind.a 的大小）——**这是未记录的环境 hack，不可复现，必须消除**（详见报告 R12）。
  #   ✅ 正确做法：按**语义对应**把 LLVM 的真实现放到 GNU 命名上（不是空档、不是别处拷来的库）：
  #        libgcc.a    ← lib/clang/<ver>/lib/windows/libclang_rt.builtins-x86_64.a  （低级运算 builtins）
  #        libgcc_eh.a ← x86_64-w64-mingw32/lib/libunwind.a                          （异常展开＝GCC 的 libgcc_eh）
  #   ✅ 实测（2026-09-16，本机）：在**官方 20260908 干净包**上做此映射后
  #      `cargo build --manifest-path host/field-render/Cargo.toml` → **exit=0**，产出 exe 180 MB。
  #      ⇒ 不再需要"钉住旧版本"，任何版本只要映射源存在即可；映射源缺失会**明确报错**，
  #        不会退化成一句难懂的 lld 链接失败。
  #
  # 断言口径（把 2026-09-16 本机真实跑通的验收标准固化）：
  #   ① 离屏自检：退出码 0 + 结论 PASS + **每幅方差 > 1**（真实语义：非纯黑/纯白的空图不算过）
  #   ② 排序校验：退出码 0（GPU 双调排序正确性）
  #   ③ L5 诊断：退出码 0 + 结论 PASS（证据调制与中性点 m=0.5 对齐）
  #   ④ 真实开窗 + URL + 上屏回读：**门禁**（run 35044362728 上真实验证通过后，
  #      本轮按 D10 去掉 `continue-on-error`，改为硬断言：退出码 0 + 回读来源＝surface + 结论 PASS）。
  #   ⑤ C9 门禁：unsafe 白名单 + 禁 transmute（D11/R10；含"门禁自检"，防止断言空转）。
  # 帧率口径（含在验收①内）：**硬件适配器 → 断言 ≥ 30**；软件适配器（runner 无 GPU）→ 如实标注并断言 > 0
  #      —— 不拿"改阈值"打绿，也不拿"CI 跑过"冒充硬件口径。
  # ===========================================================================================
  host-windows:
    name: 宿主 field-render（Windows 构建 + 客观验收）
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable) + GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      # ---- R1 修复固化为 CI 步骤（勿删；否则 dlltool 报 program not found）----
      - name: 修复 R1 —— 安装 llvm-mingw 并把 bin 前置到 PATH
        shell: bash
        run: |
          set -euo pipefail
          # 版本：不再需要"钉住自带 libgcc 的旧版本"（官方任何版本都不带 libgcc）；
          # 改用下方**语义映射**补齐 GNU 命名的两只库。详见文件头注释。
          VER=20260908
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${VER}/llvm-mingw-${VER}-ucrt-x86_64.zip"
          TMPU="$(cygpath -u "$RUNNER_TEMP")"
          curl -sSL "$URL" -o "$TMPU/llvm-mingw.zip"
          unzip -q "$TMPU/llvm-mingw.zip" -d "$TMPU/lm"
          LMROOT="$TMPU/lm/llvm-mingw-${VER}-ucrt-x86_64"
          BIN_M="$(cygpath -m "$LMROOT/bin")"
          test -f "$BIN_M/dlltool.exe" || { echo "::error::llvm-mingw 解压后找不到 dlltool.exe：$BIN_M"; exit 1; }
          # ---- libgcc 语义映射：rustc 无条件请求 -lgcc_eh / -lgcc，llvm-mingw 用 compiler-rt + libunwind ----
          # ① 先断言映射源存在（缺失就明确报错，别让它在几十分钟后的构建步骤里变成一句难懂的 lld 报错）
          SYSLIB="$LMROOT/x86_64-w64-mingw32/lib"
          CLDIRS=("$LMROOT"/lib/clang/*/lib/windows)
          CLDIR="${CLDIRS[0]}"
          test -d "$CLDIR" || { echo "::error::找不到 llvm-mingw 的 compiler-rt 目录：$CLDIR"; exit 1; }
          test -f "$CLDIR/libclang_rt.builtins-x86_64.a" || { echo "::error::缺映射源 $CLDIR/libclang_rt.builtins-x86_64.a"; exit 1; }
          test -f "$SYSLIB/libunwind.a" || { echo "::error::缺映射源 $SYSLIB/libunwind.a"; exit 1; }
          # ② 按语义对应就位（真实现，非空档）：libgcc=低级运算 builtins；libgcc_eh=异常展开 libunwind
          cp "$CLDIR/libclang_rt.builtins-x86_64.a" "$SYSLIB/libgcc.a"
          cp "$SYSLIB/libunwind.a" "$SYSLIB/libgcc_eh.a"
          # ③ 断言映射结果（构建步骤会用到；这里失败了就不必等到链接期）
          for f in libgcc.a libgcc_eh.a libmingw32.a libmingwex.a; do
            test -f "$SYSLIB/$f" || { echo "::error::libgcc 映射后 sysroot 仍缺 $f（$SYSLIB）"; exit 1; }
          done
          ls -l "$SYSLIB/libgcc.a" "$SYSLIB/libgcc_eh.a"
          echo "SYSLIB_LIBGCC_MAPPED_OK：libgcc.a←compiler-rt builtins / libgcc_eh.a←libunwind"
          echo "LLVM_MINGW_BIN=$BIN_M" >> "$GITHUB_ENV"
          echo "$BIN_M" >> "$GITHUB_PATH"
          export PATH="$BIN_M:$PATH"
          command -v dlltool >/dev/null 2>&1 || { echo "::error::前置 PATH 后仍找不到 dlltool"; exit 1; }
          echo "dlltool => $(command -v dlltool)"
          # 注意：这里不要写 `dlltool --version | head -1`——head 提前关闭管道会让 dlltool 收 SIGPIPE，
          # 在 `set -o pipefail` 下整步失败（第一次跑就踩了）。落盘后取值，避免管道提前关闭。
          "$BIN_M/dlltool.exe" --version > "$TMPU/dlltool-version.txt" 2>&1 || true
          sed -n '1p' "$TMPU/dlltool-version.txt"
          echo "llvm-mingw bin 已前置 PATH：$BIN_M"

      - name: 构建宿主 field-render（GNU + llvm-mingw；短 target-dir 规避 MAX_PATH）
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$LLVM_MINGW_BIN:$PATH"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER="$LLVM_MINGW_BIN/x86_64-w64-mingw32-gcc.exe"
          echo "dlltool => $(command -v dlltool)"
          echo "linker  => $CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER"
          cargo build --manifest-path host/field-render/Cargo.toml \
            --target x86_64-pc-windows-gnu \
            --target-dir "$(cygpath -m "$RUNNER_TEMP/frt")"
          EXE="$(cygpath -m "$RUNNER_TEMP/frt")/x86_64-pc-windows-gnu/debug/field-render.exe"
          test -f "$EXE" || { echo "::error::构建后找不到 $EXE"; exit 1; }
          echo "EXE=$EXE" >> "$GITHUB_ENV"
          ls -la "$EXE"

      # D-a（R18 遗留）：`host/field-render` **不在 workspace** ⇒ 原来的 `test` job（跑 workspace）从不包含它。
      # 后果实测：该 crate 里 3 个单元测试**长期必红而无人知**（R18）。本步骤把它纳入自动回归。
      # 与"构建宿主"用**同一套工具链**（GNU + llvm-mingw），保证测的就是实际分发的那个 target。
      - name: 单元测试 field-render（独立 crate；R18 的 3 个必红测试就发生在这里）
        shell: bash
        run: |
          set -uo pipefail
          set +e     # 同其它断言步骤：外层 `shell: bash` 自带 -e，必须显式关掉才能打印失败详情
          export RUST_BACKTRACE=1
          export PATH="$LLVM_MINGW_BIN:$PATH"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER="$LLVM_MINGW_BIN/x86_64-w64-mingw32-gcc.exe"
          # 显式断言 dlltool 可见：`cargo test` 同样要链接，缺 dlltool 会退化成
          # `error calling dlltool 'dlltool.exe': program not found`（R4 的老症状）。
          # 这里提前给出**明确**报错，而不是让它在几十秒后才以难懂形式出现。
          test -x "$CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER" \
            || { echo "::error::链接器不存在：$CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER"; exit 1; }
          command -v dlltool >/dev/null 2>&1 \
            || { echo "::error::PATH 里找不到 dlltool（R4 症状；检查 GITHUB_PATH 与 LLVM_MINGW_BIN 的形式）"; exit 1; }
          echo "linker  => $CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER"
          echo "dlltool => $(command -v dlltool)"
          cargo test --manifest-path host/field-render/Cargo.toml \
            --target x86_64-pc-windows-gnu \
            --target-dir "$(cygpath -m "$RUNNER_TEMP/frt")" \
            --bin field-render > unittest.log 2>&1
          CODE=$?
          cat unittest.log
          echo "---- exit=$CODE ----"
          test "$CODE" = "0" || { echo "::error::field-render 单元测试失败（exit=$CODE）"; exit 1; }
          # 显式断言"全绿"：不接受"0 failed 但一个都没跑"这类空转
          grep -qE '^test result: ok\. [0-9]+ passed; 0 failed' unittest.log \
            || { echo "::error::单元测试结果不是全绿（缺 'test result: ok. N passed; 0 failed'）"; exit 1; }
          PASSED="$(grep -m1 -oE '[0-9]+ passed' unittest.log | grep -oE '[0-9]+' || true)"
          awk -v n="${PASSED:-0}" 'BEGIN{exit !(n>=30)}' \
            || { echo "::error::通过的测试数 $PASSED 过少（预期 ≥30）——疑似空转"; exit 1; }
          echo "FIELD_RENDER_UNIT_TESTS_OK（$PASSED passed）"

      # C9 门禁落地（D11/R10）：把 CONSTRAINTS.md C9 的"文字约定"变成**可判定断言**。
      # 本步骤之所以能成为门禁（而不是纸上规矩），靠三点：判据可自动判定 + 白名单单一来源 + **门禁自检**。
      - name: 验收 ⑤ C9 门禁 —— unsafe 白名单 + 禁 transmute（含门禁自检）
        shell: bash
        run: |
          set -uo pipefail
          set +e     # 同验收①：外层 `shell: bash` 自带 -e，必须显式关掉才能打印诊断
          # C9：unsafe 只允许"边界形态"（边界集中 + `// SAFETY:` 论证 + 禁 transmute + 白名单登记）。
          # 判定三条：
          #   ① `transmute` 全仓零出现（C9 明令一律禁止，含别名/重导出）
          #   ② "真实 unsafe"（非注释行）所在文件必须**全部**登记在 coordination/unsafe_whitelist.txt
          #   ③ 每个含真实 unsafe 的文件，`// SAFETY:` 出现次数必须 ≥ 真实 unsafe 行数
          # 现状：真实 unsafe 0 处、白名单为空 ⇒ ①②③ 自然成立（机制就位、尚未放行任何条目）。

          # —— 统一的"真实代码行"判定（**排除整行注释**）：主判定与门禁自检**共用同一段逻辑**，
          #    保证自检验的就是真逻辑。
          #    ⚠️ 注释里提到 `unsafe` / `transmute` **不算违规**（本仓库注释正在讨论它们，
          #    如 window.rs 的"不需要 unsafe，也不是 transmute 类取巧"）。
          real_code_lines() {
            local pat="$1"; shift
            grep -rnE "$pat" --include="*.rs" "$@" 2>/dev/null \
              | grep -vE ':[[:space:]]*(//|/\*|\*)' || true
          }

          # ⚠️ 判据必须锚在**关键字/调用的确切用法**上，否则会大面积假阳性——
          #    门禁第一次本地干跑就误报 `let unsafe_q = ...`（**变量名**，不是 unsafe 语法）。
          #    · PAT_UNSAFE：只认 unsafe 块/`unsafe fn`/`unsafe impl`/`unsafe trait`/`unsafe extern`
          #      （`unsafe_q`、`#[allow(unsafe_code)]` 因词边界不匹配 → 不违规）
          #    · PAT_TRANSMUTE：只认 transmute 作为独立词/调用（`transmute::<..>(..)`）
          PAT_UNSAFE='unsafe[[:space:]]*(\{|fn([^A-Za-z0-9_]|$)|impl([^A-Za-z0-9_]|$)|trait([^A-Za-z0-9_]|$)|extern([^A-Za-z0-9_]|$))'
          PAT_TRANSMUTE='(^|[^A-Za-z0-9_])transmute([^A-Za-z0-9_]|$)'

          # —— 扫描范围：内核 + 各宿主 crate + **阶段二新增的裸机层** ——
          # ⚠️ 2026-09-17（2.3）：原先只扫 `meta-kernel-core/src` 与 `host/*/src`，
          #    而 2.3 的 unsafe 出现在 `meta-kernel-boot/kernel/src` 与 `meta-kernel-mem/src`。
          #    若不加进来，白名单登记会**形式上合规、实际没被检查**（门禁空转）。
          #    ⇒ 判据范围必须与代码范围同步（同 R17"两处口径须逐字一致"的教训）。
          DRS="meta-kernel-core/src meta-kernel-core-nostd/src meta-kernel-mem/src meta-kernel-boot/kernel/src"
          for d in host/*/src; do [ -d "$d" ] && DRS="$DRS $d"; done
          echo "扫描目录：$DRS"

          echo "===== ① transmute 绝对禁止 ====="
          HITS_TR="$(real_code_lines "$PAT_TRANSMUTE" $DRS)"
          if [ -n "$HITS_TR" ]; then
            echo "$HITS_TR"
            echo "::error::发现 transmute —— C9 明令一律禁止"
            exit 1
          fi
          echo "TRANSMUTE_NONE_OK"

          echo "===== ② 真实 unsafe（非注释行）必须全部在白名单内 ====="
          WLFILE="coordination/unsafe_whitelist.txt"
          test -f "$WLFILE" || { echo "::error::找不到白名单 $WLFILE（C9 门禁的单一来源）"; exit 1; }
          WL="$(sed -e 's/#.*$//' -e 's/[[:space:]]*$//' "$WLFILE" | grep -v '^[[:space:]]*$' || true)"
          if [ -z "$WL" ]; then echo "白名单条目：（空 —— 不放行任何真实 unsafe）"; else echo "白名单条目：$(echo "$WL" | tr '\n' ' ')"; fi

          REAL="$(real_code_lines "$PAT_UNSAFE" $DRS)"
          REALF="$(echo "$REAL" | sed -E 's/^([^:]+):[0-9]+:.*$/\1/' | sort -u | grep -v '^$' || true)"
          if [ -n "$REALF" ]; then
            BAD=""
            for f in $REALF; do
              echo "  真实 unsafe 出现于：$f"
              ok=0
              for w in $WL; do [ "$w" = "$f" ] && ok=1; done
              [ "$ok" = "1" ] || BAD="$BAD $f"
            done
            if [ -n "$BAD" ]; then
              echo "::error::以下文件含真实 unsafe 但未登记在白名单：$BAD"
              exit 1
            fi
          fi
          echo "UNSAFE_WHITELIST_OK（真实 unsafe 文件数=$(printf '%s\n' "$REALF" | grep -c . || true)）"

          echo "===== ③ 每处真实 unsafe 必须有 // SAFETY: 论证 ====="
          if [ -z "$REALF" ]; then
            echo "（当前无真实 unsafe —— 该条自然成立）"
          else
            for f in $REALF; do
              N="$(printf '%s\n' "$REAL" | grep -c "^${f}:" || true)"
              M="$(grep -c 'SAFETY:' "$f" || true)"
              echo "  $f：真实 unsafe 行数=$N ｜ // SAFETY: 次数=$M"
              awk -v m="$M" -v n="$N" 'BEGIN{exit !(m>=n)}' \
                || { echo "::error::$f 的 // SAFETY: 论证少于 unsafe 处数（$M < $N）"; exit 1; }
            done
          fi
          echo "SAFETY_ARGUMENT_COVERED_OK"

          echo "===== ④ 门禁自检（正反两侧，确认断言没有空转）====="
          T="$(cygpath -u "$RUNNER_TEMP")/c9selftest"
          mkdir -p "$T/clean" "$T/dirty"
          # clean 样本：三类"看似有关、实为合规"的写法，都必须**不**被计入
          #   · 整行注释里提到关键字（本仓库真实存在）
          #   · 变量名叫 `unsafe_q`（本仓库真实存在 —— 门禁最初就误报过它）
          #   · `#[allow(unsafe_code)]` 属性
          printf '// unsafe 与 transmute 只出现在注释里，应被忽略\nfn a() {}\n' > "$T/clean/a.rs"
          printf 'let unsafe_q = 1;\n#[allow(unsafe_code)]\nfn b() {}\n' > "$T/clean/b.rs"
          # dirty 样本：真实违规写法，必须被计入
          printf 'unsafe { } // 真实 unsafe 块\n' > "$T/dirty/c.rs"
          printf 'fn d(){ let x: u32 = std::mem::transmute(1.0f32); }\n' > "$T/dirty/d.rs"
          C_CLEAN="$(real_code_lines "$PAT_UNSAFE" "$T/clean" | grep -c . || true)"
          C_DIRTY="$(real_code_lines "$PAT_UNSAFE" "$T/dirty" | grep -c . || true)"
          C_TR="$(real_code_lines "$PAT_TRANSMUTE" "$T/dirty" | grep -c . || true)"
          C_TR_CLEAN="$(real_code_lines "$PAT_TRANSMUTE" "$T/clean" | grep -c . || true)"
          echo "  自检：合规样本 unsafe 计数=$C_CLEAN（期望 0；样本含注释/变量名 unsafe_q/allow 属性）"
          echo "  自检：违规样本 unsafe 计数=$C_DIRTY（期望 ≥1）｜transmute 计数=$C_TR（期望 ≥1）｜合规样本 transmute 计数=$C_TR_CLEAN（期望 0）"
          test "$C_CLEAN" = "0" || { echo "::error::门禁自检失败——合规样本被判为违规（假阳性，如变量名 unsafe_q）"; exit 1; }
          awk -v c="$C_DIRTY" 'BEGIN{exit !(c>=1)}' || { echo "::error::门禁自检失败——真实 unsafe 未被识别（门禁形同空转）"; exit 1; }
          awk -v c="$C_TR" 'BEGIN{exit !(c>=1)}' || { echo "::error::门禁自检失败——真实 transmute 未被识别"; exit 1; }
          test "$C_TR_CLEAN" = "0" || { echo "::error::门禁自检失败——注释中的 transmute 被误判为违规"; exit 1; }
          echo "C9_GATE_SELFTEST_OK"

      # 诊断性：runner 有没有可用的图形适配器？失败原因常在这里，先如实记下来（不计入门禁）。
      - name: 环境诊断 —— runner 的显示适配器与 wgpu 枚举情况
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "===== Win32_VideoController ====="
          powershell -NoProfile -Command "Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,Status | Format-Table -AutoSize" 2>&1 || true
          echo "===== wgpu 适配器枚举（跑一次 --selftest，取前 25 行）====="
          export PATH="$LLVM_MINGW_BIN:$PATH"
          "$EXE" --selftest > diag_env.log 2>&1
          echo "---- exit=$? ----"
          sed -n '1,25p' diag_env.log

      - name: 验收 ① 离屏自检（断言 退出码0 + PASS + 方差>1 + 帧率口径）
        shell: bash
        run: |
          # ⚠️ GitHub 的 `shell: bash` 展开为 `bash --noprofile --norc -e -o pipefail {0}` —— **外层自带 `-e`**。
          #    只写 `set -uo pipefail` **并不能**去掉它：被测程序一旦非零退出，脚本会立刻结束，
          #    后面的 `CODE=$?` / `cat 日志` 全被跳过（R1-b 第四次失败正是如此：日志一片空白，
          #    只知道 exit=101，看不到任何 panic 信息）。故必须**显式 `set +e`**，靠下方显式断言判定成败。
          set -uo pipefail
          set +e
          export RUST_BACKTRACE=1     # panic 时给出回溯，便于定位（不改变断言）
          export PATH="$LLVM_MINGW_BIN:$PATH"
          test -n "${EXE:-}" || { echo "::error::EXE 未设置"; exit 1; }
          "$EXE" --selftest > selftest.log 2>&1
          CODE=$?
          cat selftest.log
          echo "---- exit=$CODE ----"
          test "$CODE" = "0" || { echo "::error::--selftest 退出码 $CODE（应为 0）"; exit 1; }
          grep -q "结论：PASS" selftest.log || { echo "::error::--selftest 结论非 PASS"; exit 1; }

          # 方差 > 1（真实语义断言：纯黑/纯白空图会一直"绿"，必须挡住）
          VARS="$(grep -oE '方差=[0-9]+(\.[0-9]+)?' selftest.log | cut -d= -f2 || true)"
          test -n "$VARS" || { echo "::error::自检输出里没有方差读数"; exit 1; }
          echo "方差读数：$(echo "$VARS" | tr '\n' ' ')"
          for v in $VARS; do
            awk -v v="$v" 'BEGIN{exit !(v>1.0)}' || { echo "::error::存在方差 $v ≤ 1（疑似纯黑/纯白空图）"; exit 1; }
          done
          echo "VARIANCE_ALL_GT_1_OK"

          # 帧率口径：硬件适配器 → ≥30；软件适配器 → >0 且如实标注
          ADAPTER="$(grep -m1 '适配器:' selftest.log || true)"
          test -n "$ADAPTER" || { echo "::error::自检输出里没有适配器行"; exit 1; }
          echo "适配器行：$ADAPTER"
          FPS="$(grep -m1 -oE '帧率：[0-9]+(\.[0-9]+)?' selftest.log | sed 's/帧率：//' || true)"
          test -n "$FPS" || { echo "::error::自检输出里没有帧率读数"; exit 1; }
          # 软件适配器识别（⚠️ 判据必须"名字优先"）：
          #   Dx12 下的 WARP 是软件光栅器，但 wgpu 报的 device_type 是 **IntegratedGpu**
          #   —— 只按 device_type 判会把 WARP 误当硬件（2026-09-16 实测：本机 Dx12 用真显卡 157.8 FPS，
          #   而 runner 的 WARP 只有 28.0 FPS，于是"软件渲染"被判成"硬件不达标"）。
          #   故以**适配器名/驱动关键词**作辅判据；命中即按软件口径（>0）断言，并在日志里如实标注。
          #   注意：这是"识别机器有没有 GPU"，**不是**把 30 改成更低的阈值。
          if echo "$ADAPTER" | grep -qiE 'basic render driver|warp|software|llvmpipe|lavapipe|swiftshader'; then
            IS_SOFTWARE=1
          else
            IS_SOFTWARE=0
          fi
          if [ "$IS_SOFTWARE" = "0" ] && echo "$ADAPTER" | grep -qE 'IntegratedGpu|DiscreteGpu|VirtualGpu'; then
            awk -v f="$FPS" 'BEGIN{exit !(f>=30)}' || { echo "::error::硬件适配器上帧率 $FPS < 30"; exit 1; }
            echo "FPS_GTE_30_ON_HARDWARE_OK ($FPS)"
          else
            awk -v f="$FPS" 'BEGIN{exit !(f>0)}' || { echo "::error::帧率 $FPS 不为正"; exit 1; }
            echo "::warning::软件适配器——帧率 $FPS 不适用'硬件 ≥30'口径，已如实记录、未按硬件断言"
          fi

      - name: 验收 ② GPU 双调排序校验
        shell: bash
        run: |
          set -uo pipefail
          set +e     # 同验收①：外层 `shell: bash` 自带 -e，必须显式关掉才能打印失败日志
          export RUST_BACKTRACE=1
          export PATH="$LLVM_MINGW_BIN:$PATH"
          "$EXE" --sortcheck > sortcheck.log 2>&1
          CODE=$?
          cat sortcheck.log
          echo "---- exit=$CODE ----"
          test "$CODE" = "0" || { echo "::error::--sortcheck 退出码 $CODE（应为 0）"; exit 1; }

      - name: 验收 ③ L5 诊断（证据调制 · 中性点对齐）
        shell: bash
        run: |
          set -uo pipefail
          set +e     # 同验收①：外层 `shell: bash` 自带 -e，必须显式关掉才能打印失败日志
          export RUST_BACKTRACE=1
          export PATH="$LLVM_MINGW_BIN:$PATH"
          "$EXE" --diag-check > diagcheck.log 2>&1
          CODE=$?
          cat diagcheck.log
          echo "---- exit=$CODE ----"
          test "$CODE" = "0" || { echo "::error::--diag-check 退出码 $CODE（应为 0，R7 已修）"; exit 1; }
          grep -q "结论：PASS" diagcheck.log || { echo "::error::--diag-check 结论非 PASS"; exit 1; }

      # ⚠️ 本步骤是**门禁**（D10 已执行：去掉 continue-on-error）。
      #    升级依据：run 35044362728 上本步骤**真实通过**（runner 无 GPU → Dx12 WARP 软件适配器，
      #    仍完成 开窗 1080×760 → 输入 URL → 取源码 108 字 → 从 surface 真实上屏纹理回读 → PASS、exit=0）。
      #    一旦本步骤转红，即为"宿主开窗链路退化"的真实信号，**不得用放宽断言的方式打绿**。
      - name: 验收 ④ 真实开窗 + URL 取源码 + 上屏回读（门禁）
        shell: bash
        run: |
          set -uo pipefail
          set +e     # 同验收①：外层 `shell: bash` 自带 -e，必须显式关掉才能打印失败日志
          export RUST_BACKTRACE=1
          export PATH="$LLVM_MINGW_BIN:$PATH"
          cat > page.html <<'HTML'
          <html><body><article>
          <p>宿主真实运行验收页：用于离屏/开窗两条链路的一致性对照。</p>
          <p>第二段正文，让水质上升、场域可辨。</p>
          </article></body></html>
          HTML
          python -m http.server 18124 >/dev/null 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          sleep 2
          curl -s -o /dev/null -w "服务 HTTP %{http_code}\n" http://127.0.0.1:18124/page.html
          "$EXE" --url http://127.0.0.1:18124/page.html --frames 120 > window.log 2>&1
          WCODE=$?
          cat window.log
          echo "---- exit=$WCODE ----"
          test "$WCODE" = "0" || { echo "::error::开窗运行退出码 $WCODE"; exit 1; }
          grep -q "回读来源：surface" window.log || { echo "::error::未从真实上屏纹理（surface）回读"; exit 1; }
          grep -q "结论：PASS" window.log || { echo "::error::开窗运行结论非 PASS"; exit 1; }

          # 独立复核帧率口径（双保险）：宿主内部已按环境感知判过一次，CI **再独立判一次**，
          # 避免"宿主把口径写松了、CI 却照收"的情况。
          #   硬件适配器 → 呈现 或 裸 口径 ≥30（**门槛不变**）
          #   软件适配器（runner 无 GPU，落 Dx12 WARP）→ 只要求 >0，并如实标注、不按硬件断言
          # 关键词表与宿主 `adapter_is_software()`（window.rs）**逐字一致**，两侧不得分叉。
          ADAPTER_W="$(grep -m1 '适配器:' window.log || true)"
          FPS_P="$(grep -m1 -oE '呈现口径 [0-9]+(\.[0-9]+)?' window.log | grep -oE '[0-9]+(\.[0-9]+)?' || true)"
          FPS_R="$(grep -m1 -oE '管线裸口径 [0-9]+(\.[0-9]+)?' window.log | grep -oE '[0-9]+(\.[0-9]+)?' || true)"
          { test -n "$FPS_P" && test -n "$FPS_R"; } || { echo "::error::window.log 里没有帧率读数"; exit 1; }
          echo "适配器行：$ADAPTER_W"
          echo "帧率读数：呈现=$FPS_P 裸=$FPS_R"
          if echo "$ADAPTER_W" | grep -qiE 'basic render driver|warp|software|llvmpipe|lavapipe|swiftshader'; then
            awk -v p="$FPS_P" -v r="$FPS_R" 'BEGIN{exit !(p>0 && r>0)}' \
              || { echo "::error::软件适配器下帧率非正（呈现 $FPS_P / 裸 $FPS_R）"; exit 1; }
            echo "::warning::软件适配器——帧率 $FPS_P/$FPS_R 属软件口径，不适用'硬件 ≥30'，已如实标注"
          else
            awk -v p="$FPS_P" -v r="$FPS_R" 'BEGIN{exit !(p>=30 || r>=30)}' \
              || { echo "::error::硬件适配器下 呈现/裸 帧率均 < 30（$FPS_P / $FPS_R）"; exit 1; }
            echo "WINDOW_FPS_GTE_30_ON_HARDWARE_OK ($FPS_P / $FPS_R)"
          fi
          echo "WINDOW_SURFACE_READBACK_PASS"

      - name: 附：release 构建（供分发的 exe；不计入门禁）
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$LLVM_MINGW_BIN:$PATH"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER="$LLVM_MINGW_BIN/x86_64-w64-mingw32-gcc.exe"
          cargo build --release --manifest-path host/field-render/Cargo.toml \
            --target x86_64-pc-windows-gnu \
            --target-dir "$(cygpath -m "$RUNNER_TEMP/frt")"

      - name: Upload 宿主验收日志（always）
        if: always()
        # R24：诊断性**产物上传**不是门禁 —— GitHub 侧产物服务抖动（实测 `Failed to FinalizeArtifact: 403 Forbidden`）
        # 会把整个 job 判红，**掩盖真实状态**（那次 20/20 个真实步骤全过、重跑即绿）。
        # 故上传步骤一律 non-fatal；**真正的门禁（测试/构建/像素断言/C9）保持硬失败，不放宽**。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: host-field-render-logs
          path: |
            selftest.log
            sortcheck.log
            diagcheck.log
            window.log
          if-no-files-found: warn

      - name: Upload 宿主 exe（release，可直接下载运行）
        if: always()
        # R24：诊断性**产物上传**不是门禁 —— GitHub 侧产物服务抖动（实测 `Failed to FinalizeArtifact: 403 Forbidden`）
        # 会把整个 job 判红，**掩盖真实状态**（那次 20/20 个真实步骤全过、重跑即绿）。
        # 故上传步骤一律 non-fatal；**真正的门禁（测试/构建/像素断言/C9）保持硬失败，不放宽**。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: field-render-exe-windows-x86_64
          path: ${{ runner.temp }}/frt/x86_64-pc-windows-gnu/release/field-render.exe
          if-no-files-found: warn

      - name: R24 检查 —— 诊断性上传是否发生软失败（显式告警 · 留痕）
        if: always()
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          set +e
          N=$(printf '%s' "$STEPS" | grep -o '"outcome":"failure"' | wc -l | tr -d ' ')
          echo "被 continue-on-error 吸收的失败步骤数：$N"
          if [ "$N" != "0" ]; then
            echo "::warning::R24 —— 本 job 有 $N 个**诊断性产物上传**软失败（GitHub 产物服务抖动）。门禁未受影响：验收①–⑤ 与 C9 门禁仍为硬失败。"
          else
            echo "R24_UPLOAD_NO_SOFT_FAILURE"
          fi
